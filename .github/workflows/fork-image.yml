name: Fork Image

on:
  push:
    branches:
      - product-edition
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build'
        required: false
        type: string
      image_tag:
        description: 'Extra image tag, for example custom-2026-05-13'
        required: false
        type: string
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string
      push_latest:
        description: 'Also push <dockerhub-username>/sub2api:latest'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          dockerhub_username='${{ secrets.DOCKERHUB_USERNAME }}'
          if [ -z "${dockerhub_username}" ]; then
            echo "DOCKERHUB_USERNAME secret is required" >&2
            exit 1
          fi
          image="${dockerhub_username}/sub2api"
          ref_name='${{ github.event.inputs.ref }}'
          if [ -z "${ref_name}" ]; then
            ref_name="${GITHUB_REF_NAME}"
          fi
          ref_name="${ref_name#refs/heads/}"
          ref_name="${ref_name#refs/tags/}"
          safe_ref="$(echo "${ref_name}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')"
          commit_sha="$(git rev-parse HEAD)"
          short_sha="${commit_sha::12}"
          base_version="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          fork_version="$(tr -d '\r\n' < backend/cmd/server/FORK_VERSION 2>/dev/null || true)"
          version="${base_version}"
          if [ -n "${fork_version}" ]; then
            version="${base_version}-${fork_version}"
          fi
          safe_version="$(echo "${version}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')"

          {
            echo "tags<<EOF"
            echo "${image}:${safe_ref}"
            echo "${image}:${safe_version}"
            echo "${image}:${safe_ref}-${short_sha}"

            extra_tag='${{ github.event.inputs.image_tag }}'
            if [ -n "${extra_tag}" ]; then
              safe_extra="$(echo "${extra_tag}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')"
              if [ -n "${safe_extra}" ]; then
                echo "${image}:${safe_extra}"
              fi
            fi

            if [ '${{ github.event.inputs.push_latest }}' = 'true' ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          platforms='${{ github.event.inputs.platforms }}'
          if [ -z "${platforms}" ]; then
            platforms='linux/amd64,linux/arm64'
          fi
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"

          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "commit=${commit_sha}" >> "$GITHUB_OUTPUT"
          echo "date=${build_date}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
