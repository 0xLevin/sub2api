name: Fork Image

on:
  push:
    branches:
      - product-edition
      - 'feature/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build'
        required: false
        type: string
      image_tag:
        description: 'Extra image tag, for example custom-2026-05-13'
        required: false
        type: string
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string
      push_latest:
        description: 'Also push <dockerhub-username>/sub2api:latest'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          dockerhub_username='${{ secrets.DOCKERHUB_USERNAME }}'
          if [ -z "${dockerhub_username}" ]; then
            echo "DOCKERHUB_USERNAME secret is required" >&2
            exit 1
          fi
          image="${dockerhub_username}/sub2api"
          ref_name='${{ github.event.inputs.ref }}'
          if [ -z "${ref_name}" ]; then
            ref_name="${GITHUB_REF_NAME}"
          fi
          ref_name="${ref_name#refs/heads/}"
          ref_name="${ref_name#refs/tags/}"
          safe_ref="$(echo "${ref_name}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')"
          commit_sha="$(git rev-parse HEAD)"
          short_sha="${commit_sha::12}"
          base_version="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          fork_version="$(tr -d '\r\n' < backend/cmd/server/FORK_VERSION 2>/dev/null || true)"
          version="${base_version}"
          if [ -n "${fork_version}" ]; then
            version="${base_version}-${fork_version}"
          fi
          safe_version="$(echo "${version}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')"

          {
            echo "tags<<EOF"
            echo "${image}:${safe_ref}"
            echo "${image}:${safe_version}"
            echo "${image}:${safe_ref}-${short_sha}"

            extra_tag='${{ github.event.inputs.image_tag }}'
            if [ -n "${extra_tag}" ]; then
              safe_extra="$(echo "${extra_tag}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')"
              if [ -n "${safe_extra}" ]; then
                echo "${image}:${safe_extra}"
              fi
            fi

            if [ '${{ github.event.inputs.push_latest }}' = 'true' ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          platforms='${{ github.event.inputs.platforms }}'
          if [ -z "${platforms}" ]; then
            platforms='linux/amd64,linux/arm64'
          fi
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"

          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "commit=${commit_sha}" >> "$GITHUB_OUTPUT"
          echo "date=${build_date}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: go version | grep -q 'go1.26.5'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PLATFORMS: ${{ steps.meta.outputs.platforms }}
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          set -euo pipefail

          mapfile -t tags <<< "${TAGS}"
          IFS=',' read -r -a platforms <<< "${PLATFORMS}"

          arch_tags=()
          for platform in "${platforms[@]}"; do
            platform="$(echo "${platform}" | xargs)"
            case "${platform}" in
              linux/amd64)
                arch="amd64"
                ;;
              linux/arm64)
                arch="arm64"
                ;;
              *)
                echo "Unsupported platform: ${platform}" >&2
                exit 1
                ;;
            esac

            context_dir="${RUNNER_TEMP}/sub2api-image-${arch}"
            rm -rf "${context_dir}"
            mkdir -p "${context_dir}/deploy"
            cp Dockerfile.goreleaser "${context_dir}/Dockerfile"
            cp deploy/docker-entrypoint.sh "${context_dir}/deploy/docker-entrypoint.sh"

            (
              cd backend
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build \
                -tags embed \
                -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.Date=${DATE} -X main.BuildType=release" \
                -trimpath \
                -o "${context_dir}/sub2api" \
                ./cmd/server
            )

            arch_tag_list=()
            for tag in "${tags[@]}"; do
              if [ -n "${tag}" ]; then
                arch_tag_list+=("${tag}-${arch}")
              fi
            done
            arch_tags+=("${arch}")

            build_args=(docker buildx build --platform "${platform}" --file "${context_dir}/Dockerfile" --push)
            for arch_tag in "${arch_tag_list[@]}"; do
              build_args+=(--tag "${arch_tag}")
            done
            build_args+=(
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
              --label "org.opencontainers.image.revision=${COMMIT}"
              "${context_dir}"
            )
            "${build_args[@]}"
          done

          for tag in "${tags[@]}"; do
            if [ -z "${tag}" ]; then
              continue
            fi
            sources=()
            for arch in "${arch_tags[@]}"; do
              sources+=("${tag}-${arch}")
            done
            docker buildx imagetools create --tag "${tag}" "${sources[@]}"
          done
